name: webscene_flutter
description: Flutter backend for the native WebScene V8, DOM, layout, and immutable-scene runtime.
version: 0.1.0
publish_to: none
homepage: https://github.com/danwalmsley/WebScene
repository: https://github.com/danwalmsley/WebScene

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  meta: ^1.12.0
  path_drawing: ^1.0.1
  vector_math: ^2.1.4

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
