name: Precompiled JavaScript workspace
on:
  push:
    branches: [feature/precompiled-javascript]
    paths: ['.github/workflows/precompiled-workspace.yml']
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Export tracked sources for native contract development
        run: git archive --format=tar.gz --output=precompiled-workspace.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: precompiled-workspace
          path: precompiled-workspace.tar.gz
          retention-days: 1
