name: Apply select popup implementation

on:
  push:
    branches: [codex/select-popup-design]
    paths:
      - eng/select-popup-apply.py
      - .github/workflows/select-popup-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/select-popup-design
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply surgical source patch
        run: python eng/select-popup-apply.py
      - name: Commit generated source edits
        shell: bash
        run: |
          rm eng/select-popup-apply.py .github/workflows/select-popup-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Implement scene-rendered select popup interaction'
          git push origin HEAD:codex/select-popup-design
