name: AppScene WebScene SDK preview
on:
  workflow_dispatch:
    inputs:
      appscene_ref:
        description: Full AppScene commit SHA for the paired SDK
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sdk-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  produce:
    # Use the existing qualified macOS Metal infrastructure and LLVM installation.
    runs-on: [self-hosted, webscene-gpu, osx-arm64]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          path: WebScene
      - uses: actions/checkout@v4
        with:
          repository: wieslawsoltes/AppScene
          ref: ${{ inputs.appscene_ref }}
          path: AppScene
      - name: Require a pinned source pair and toolchain
        env:
          APPSCENE_REF: ${{ inputs.appscene_ref }}
        run: |
          [[ "$APPSCENE_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C AppScene rev-parse HEAD)" = "$APPSCENE_REF"
          /opt/homebrew/opt/llvm/bin/clang++ --version | grep '22.1.1'
          cmake --version
          ninja --version
          cargo --version
          node --version
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: WebScene/global.json
      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/sdk-dependencies
            WebScene/artifacts/graphics-sdk/osx-arm64
          key: sdk-preview-deps-osx-arm64-${{ hashFiles('AppScene/eng/sdk/compatibility.lock.json', 'AppScene/dependencies/skia/**', 'WebScene/eng/graphics/**', 'WebScene/scripts/build-native-engine-runtime.sh', 'WebScene/third-party/v8-patches/**', 'WebScene/packaging/WebScene.NativeEngine.Runtime/patches/**') }}
      - name: Build pinned dependency profiles
        run: |
          python3 AppScene/eng/sdk/dependencies.py --webscene "$GITHUB_WORKSPACE/WebScene" \
            --output "$RUNNER_TEMP/sdk-dependencies" --jobs 6
      - name: Produce SDK and archive
        run: |
          python3 AppScene/eng/sdk/build.py \
            --webscene "$GITHUB_WORKSPACE/WebScene" \
            --webscene-revision "$(git -C WebScene rev-parse HEAD)" \
            --appscene-revision "$(git -C AppScene rev-parse HEAD)" \
            --v8-root "$RUNNER_TEMP/sdk-dependencies/v8-workspace/v8" \
            --v8-output "$RUNNER_TEMP/sdk-dependencies/v8-workspace/v8/out/arm64/ReleasePartitionAlloc" \
            --graphics-sdk "$GITHUB_WORKSPACE/WebScene/artifacts/graphics-sdk/osx-arm64" \
            --skia-sdk "$RUNNER_TEMP/sdk-dependencies/skia-sdk" \
            --dependency-manifest "$RUNNER_TEMP/sdk-dependencies/dependency-manifest.json" \
            --output "$RUNNER_TEMP/appscene-webscene-sdk"
      - uses: actions/upload-artifact@v4
        with:
          name: appscene-webscene-sdk-osx-arm64
          path: |
            ${{ runner.temp }}/appscene-webscene-sdk.tar.gz
            ${{ runner.temp }}/appscene-webscene-sdk.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
  consume:
    needs: produce
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: appscene-webscene-sdk-osx-arm64
          path: artifact
      - name: Install consumer development tools
        run: |
          brew install llvm cmake ninja node
          /opt/homebrew/opt/llvm/bin/clang++ --version | grep '22.1.1'
      - name: Verify and consume without producer checkouts
        run: |
          cd artifact
          shasum -a 256 -c appscene-webscene-sdk.tar.gz.sha256
          tar -xzf appscene-webscene-sdk.tar.gz
          python3 appscene-webscene-sdk/share/appscene/tools/qualify.py \
            --sdk "$PWD/appscene-webscene-sdk" --output "$RUNNER_TEMP/sdk-consumer" \
            --deny-source "$GITHUB_WORKSPACE/AppScene" --deny-source "$GITHUB_WORKSPACE/WebScene"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-installed-consumer-evidence
          path: |
            ${{ runner.temp }}/sdk-consumer/qualification.json
            ${{ runner.temp }}/sdk-consumer/*.log
  presentation:
    needs: [produce, consume]
    runs-on: [self-hosted, webscene-gpu, osx-arm64]
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: appscene-webscene-sdk-osx-arm64
          path: artifact
      - name: Run actual Metal presentation and application contracts
        run: |
          cd artifact
          shasum -a 256 -c appscene-webscene-sdk.tar.gz.sha256
          tar -xzf appscene-webscene-sdk.tar.gz
          python3 appscene-webscene-sdk/share/appscene/tools/qualify.py \
            --sdk "$PWD/appscene-webscene-sdk" --output "$RUNNER_TEMP/sdk-presentation" \
            --deny-source "$GITHUB_WORKSPACE/AppScene" --deny-source "$GITHUB_WORKSPACE/WebScene" --run-apps
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-metal-qualification-evidence
          path: |
            ${{ runner.temp }}/sdk-presentation/qualification.json
            ${{ runner.temp }}/sdk-presentation/*.log
            ${{ runner.temp }}/sdk-presentation/kestrel-*.json
