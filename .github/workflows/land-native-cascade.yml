name: Apply and test portable native cascade
on:
  push:
    branches: [codex/linux-headless-platform]
    paths: ['.automation/native-cascade.patch', '.github/workflows/land-native-cascade.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'SceneTech/WebScene' && github.ref == 'refs/heads/codex/linux-headless-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Apply source correction
        shell: bash
        run: |
          set -euo pipefail
          echo '1b1fc47dae092b12ca10dbd45a6a05f0877cd53967319d4387e21263e1647573  .automation/native-cascade.patch' | sha256sum --check
          git apply --check .automation/native-cascade.patch
          git apply --index .automation/native-cascade.patch
          git rm .automation/native-cascade.patch .github/workflows/land-native-cascade.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'fix: preserve cascade ordering without Clang 18 recursive-lambda compiler crash'
          git push origin HEAD:refs/heads/codex/linux-headless-platform
      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-tools-18 ninja-build
          python3 -m pip install 'cmake==3.31.6'
      - name: Build and run unchanged native contracts
        shell: bash
        run: |
          set -euo pipefail
          cmake -G Ninja -S src/WebScene.NativeWeb -B artifacts/native-linux -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++-18 -DWEBSCENE_NATIVE_WEB_GPU=OFF
          cmake --build artifacts/native-linux --parallel 2 2>&1 | tee artifacts/native-linux-build.log
          ctest --test-dir artifacts/native-linux --output-on-failure --output-junit native-linux-tests.xml 2>&1 | tee artifacts/native-linux-tests.log
      - name: Build native Linux SDK
        shell: bash
        run: |
          set -euo pipefail
          cmake -G Ninja -S src/WebScene.Sdk -B artifacts/native-sdk -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 -DWEBSCENE_SDK_ENABLE_WEBGPU=OFF -DCMAKE_INSTALL_PREFIX="$PWD/artifacts/sdk"
          cmake --build artifacts/native-sdk --parallel 2 2>&1 | tee artifacts/native-sdk-build.log
          cmake --install artifacts/native-sdk
          tar -czf artifacts/native-linux-sdk-no-gpu.tar.gz -C artifacts sdk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-linux-contract-evidence
          path: |
            artifacts/*.log
            artifacts/native-linux/native-linux-tests.xml
            artifacts/native-linux/Testing/Temporary/
            artifacts/native-linux-sdk-no-gpu.tar.gz
          retention-days: 14
