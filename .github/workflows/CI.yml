name: CI

on:
  workflow_dispatch:
  push:
    branches:
    - main
    - release/*
  pull_request:
    branches:
    - main
    - release/*

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: Build and test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Restore
      run: dotnet restore WebScene.sln
    - name: Build Release
      run: dotnet build WebScene.sln -c Release --no-restore
    - name: Portable Core contracts
      run: dotnet test tests/WebScene.Core.Tests/WebScene.Core.Tests.csproj -c Release --no-build
    - name: Portable DOM contracts
      run: dotnet test tests/WebScene.Dom.Tests/WebScene.Dom.Tests.csproj -c Release --no-build
    - name: Portable CSS and layout contracts
      run: dotnet test tests/WebScene.Css.Tests/WebScene.Css.Tests.csproj -c Release --no-build
    - name: Portable graphics contracts
      run: dotnet test tests/WebScene.Graphics.Tests/WebScene.Graphics.Tests.csproj -c Release --no-build
    - name: Backend authoring contracts
      run: dotnet test tests/WebScene.Backend.Abstractions.Tests/WebScene.Backend.Abstractions.Tests.csproj -c Release --no-build
    - name: React and TypeScript SDK contracts
      run: dotnet test tests/WebScene.Sdk.Tests/WebScene.Sdk.Tests.csproj -c Release --no-build
    - name: Avalonia component host contracts
      run: dotnet test tests/WebScene.Sdk.Avalonia.Tests/WebScene.Sdk.Avalonia.Tests.csproj -c Release --no-build
    - name: TypeScript profile and bundler tooling
      run: |
        npm ci --prefix tooling/webscene
        npm test --prefix tooling/webscene
    - name: Build and test component assets
      run: |
        npm ci --prefix samples/components
        npm run build --prefix samples/components
        npm run check --prefix samples/components
        npm test --prefix samples/components
    - name: Architecture dependency gates
      run: dotnet test tests/WebScene.Architecture.Tests/WebScene.Architecture.Tests.csproj -c Release --no-build
    - name: Backend package smoke
      run: dotnet run --project tests/WebScene.Backend.PackageSmoke/WebScene.Backend.PackageSmoke.csproj -c Release --no-build
    - name: Avalonia headless tests
      run: dotnet test tests/WebScene.Backend.Avalonia.Tests/WebScene.Backend.Avalonia.Tests.csproj -c Release --no-build
    - name: WPT manifest integrity
      run: dotnet run --project tests/WebPlatformSubset/runner/WebScene.WebPlatformSubset.Runner.csproj -c Release --no-build -- --selection all --list
    - name: Native C++ portability build (without V8)
      run: >-
        cmake
        -S experiments/WebScene.NativeEngine.Probe
        -B artifacts/native-engine-portability
        -DCMAKE_BUILD_TYPE=Release
        -DWEBSCENE_NATIVE_ENGINE_ENABLE_V8=OFF
        -DWEBSCENE_NATIVE_ENGINE_CERTIFICATION=OFF
    - name: Compile native C++ portability target
      run: cmake --build artifacts/native-engine-portability --config Release --parallel
