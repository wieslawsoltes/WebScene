name: Apply native offscreen completion fix
on:
  push:
    branches: [codex/linux-headless-platform]
    paths: ['.automation/offscreen-completion.patch', '.github/workflows/land-offscreen-completion.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'SceneTech/WebScene' && github.ref == 'refs/heads/codex/linux-headless-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified source change and remove transport
        run: |
          set -euo pipefail
          sed -i 's/^ diff --git/diff --git/' .automation/offscreen-completion.patch
          echo 'cbbb5896fb28b12032d8c654f2a07751d8ad2a9b2e0dcad036337a904ad4474a  .automation/offscreen-completion.patch' | sha256sum --check
          git apply --check .automation/offscreen-completion.patch
          git apply --index .automation/offscreen-completion.patch
          git rm -f .automation/offscreen-completion.patch .github/workflows/land-offscreen-completion.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'fix: drive offscreen GPU completion independently of application frames'
          git push origin HEAD:refs/heads/codex/linux-headless-platform
