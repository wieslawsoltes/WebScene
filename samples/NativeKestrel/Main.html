<!doctype html>
<html><head><meta charset="utf-8"><title>Kestrel CAD</title>
<link rel="stylesheet" href="Main.css"></head><body>
<main id="app">
  <div id="toolbar"><h1>Kestrel CAD</h1><button id="undo">Undo</button><button id="redo">Redo</button><button id="fit">Fit</button><button id="pan">Pan</button><button id="wireframe">Wireframe</button><button id="shaded">Shaded</button></div>
  <div id="workspace">
    <div id="sidebar"><h2>Layers</h2><div id="layers"></div></div>
    <div id="viewport-panel"><canvas id="viewport" width="800" height="600"></canvas></div>
  </div>
  <p id="status">Ready</p>
</main>
<template id="layer-row"><div class="layer-row" data-ref="row"><button class="layer-name" data-ref="name">Layer</button><button data-ref="visibility">Hide</button></div></template>
</body></html>
