<!doctype html><html id="html-root" data-theme="dark"><head><style>
:root { padding: 3px; }
html[data-theme="light"] { padding: 7px; }
html[data-theme] > body { padding: 2px; }
body { margin: 0; }
.outer { padding: 10px; }
button { font-family: Arial, sans-serif; width: 20px; height: 20px; }
.outer > button { font-family: Arial, sans-serif; width: 30px; }
.outer .chosen { width: 40px; }
#target { width: 50px; }
.chosen { width: 60px !important; }
button:focus { height: 30px; }
@media (max-width: 400px) { #target { height: 40px; } }
</style></head><body><div class="outer"><button id="target" class="chosen" style="width: 70px">Go</button><button id="other">Other</button><canvas id="canvas" width="80" height="40"></canvas></div></body></html>
