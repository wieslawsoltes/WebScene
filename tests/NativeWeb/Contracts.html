<!doctype html><html id="html-root" data-theme="dark"><head><style>
:root { padding: 3px; --accent: #5ac6d2; --panel-width: 222px; --shadow:0 15px 40px #0005; --border: 1px solid var(--accent); }
html[data-theme="light"] { padding: 7px; --panel-width:195px; }
html[data-theme] > body { padding: 2px; }
body { margin: 0; }
.outer { padding: 10px; }
button { font-family: Arial, sans-serif; width: 20px; height: 20px; }
.outer > button { font-family: Arial, sans-serif; width: 30px; }
.outer .chosen { width: 40px; }
#target { width: 50px; }
.chosen { width: 60px !important; }
button:focus { height: 30px; }
@media (max-width: 400px) { #target { height: 40px; } }
#variable-probe { overflow:hidden; text-align:center; white-space:nowrap; box-shadow:var(--shadow); border:0; border-top:1px solid var(--accent); width:var(--panel-width); color:var(--accent); height:var(--missing, 12px); }
#variable-grid { display:grid; grid-template-columns:var(--panel-width) minmax(250px,1fr) 252px; }
@media (max-height:300px) { :root { --panel-width:175px; } }
#variable-probe:not([data-compact]) { min-width:100px; }
#negation { width:10px; } #negation:not([data-excluded]) { width:20px; }
#flex-test { display:flex; width:300px; } #flex-a { flex:1; } #flex-b { flex:2; }
#font-probe { font:10px/19px Consolas,monospace; }
#dynamic-viewport { height:50dvh; width:50dvw; }
</style></head><body><div class="outer"><button id="target" class="chosen" style="width: 70px">Go</button><button id="other">Other</button><canvas id="canvas" width="80" height="40"></canvas></div><div id="variable-probe"></div><div id="variable-grid"><div id="grid-left"></div><div id="grid-middle"></div><div id="grid-right"></div></div><div id="negation"></div><div id="flex-test"><div id="flex-a"></div><div id="flex-b"></div></div><div id="font-probe">FontProbe</div><div id="dynamic-viewport"></div></body></html>
