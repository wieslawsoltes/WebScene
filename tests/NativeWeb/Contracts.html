<!doctype html><html id="html-root" data-theme="dark"><head><style>
:root { padding: 3px; --accent: #5ac6d2; --panel-width: 222px; --shadow:0 15px 40px #0005; --border: 1px solid var(--accent); }
html[data-theme="light"] { padding: 7px; --panel-width:195px; --svg-paint:#112233; }
html[data-theme] > body { padding: 2px; }
body { margin: 0; }
.outer { padding: 10px; }
button { font-family: Arial, sans-serif; width: 20px; height: 20px; }
.outer > button { font-family: Arial, sans-serif; width: 30px; }
.outer .chosen { width: 40px; }
#target { width: 50px; }
.chosen { width: 60px !important; }
button:focus { height: 30px; }
@media (max-width: 400px) { #target { height: 40px; } }
#variable-probe { overflow:hidden; text-align:center; white-space:nowrap; box-shadow:var(--shadow); border:0; border-bottom:1px solid color-mix(in srgb,var(--accent) 25%,transparent); border-top:1px solid var(--accent); width:var(--panel-width); color:var(--accent); height:var(--missing, 12px); }
#variable-grid { display:grid; grid-template-columns:var(--panel-width) minmax(250px,1fr) 252px; }
@media (max-height:300px) { :root { --panel-width:175px; } }
#variable-probe:not([data-compact]) { min-width:100px; }
#negation { width:10px; } #negation:not([data-excluded]) { width:20px; }
#flex-test { display:flex; width:300px; } #flex-a { flex:1; } #flex-b { flex:2; }
#font-probe { font:10px/19px Consolas,monospace; }
#dynamic-viewport { height:50dvh; width:50dvw; }
#hit-stack { position:relative; width:100px; height:40px; } #hit-back,#hit-front { position:absolute; left:0; top:0; width:100px; height:40px; } #hit-front { z-index:10; } #hit-front.pass { pointer-events:none; }
#svg-paint polygon { fill:var(--svg-paint, var(--accent))!important; stroke:#ffffff; }
#flex-min-column { display:flex; flex-direction:column; height:400px; }
#flex-min-row { display:flex; width:400px; }
#flex-min-column > div { flex:1; min-height:140px; }
#flex-min-row > div { flex:1; min-width:140px; }
#numeric-length { width:+.5e1px; height:7.5e-1px; margin-left:-.25px; opacity:8e-1; }
</style></head><body><div class="outer"><button id="target" class="chosen" style="width: 70px">Go</button><button id="other">Other</button><canvas id="canvas" width="80" height="40"></canvas></div><div id="variable-probe"></div><div id="variable-grid"><div id="grid-left"></div><div id="grid-middle"></div><div id="grid-right"></div></div><div id="negation"></div><div id="flex-test"><div id="flex-a"></div><div id="flex-b"></div></div><div id="font-probe">FontProbe</div><div id="dynamic-viewport"></div><div id="hit-stack"><button id="hit-back">Back</button><button id="hit-front">Front</button></div><svg id="svg-paint" width="30" height="30" viewBox="0 0 30 30"><polygon points="0,0 30,0 15,30"></polygon></svg><section id="flex-min-column"><div id="flex-min-height"></div></section><section id="flex-min-row"><div id="flex-min-width"></div></section><div id="numeric-length"></div></body></html>
