<!doctype html>
<meta charset="utf-8">
<title>Autonomous custom element lifecycle produces ordinary layout and paint</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: white; }
  body { font: 16px/20px Arial, sans-serif; color: rgb(24, 30, 42); }
  product-card { display: block; width: 320px; margin: 24px; }
  .card {
    display: flex;
    box-sizing: border-box;
    width: 320px;
    padding: 16px;
    gap: 12px;
    border: 2px solid rgb(48, 82, 160);
    border-radius: 12px;
    background: rgb(240, 245, 255);
  }
  .badge {
    flex: 0 0 40px;
    height: 40px;
    border-radius: 20px;
    background: rgb(48, 82, 160);
  }
  .copy { flex: 1 1 auto; min-width: 0; }
  .title { font-weight: 700; }
  .detail { margin-top: 4px; color: rgb(70, 78, 94); }
</style>
<product-card></product-card>
<script>
  customElements.define('product-card', class extends HTMLElement {
    connectedCallback() {
      if (this.firstElementChild) return;
      this.innerHTML = '<div class="card"><div class="badge"></div><div class="copy"><div class="title">Ready component</div><div class="detail">Lifecycle-created content participates in normal flex layout.</div></div></div>';
    }
  });
</script>
