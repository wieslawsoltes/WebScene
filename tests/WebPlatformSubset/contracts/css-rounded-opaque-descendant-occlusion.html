<!doctype html>
<meta charset="utf-8">
<title>An opaque rounded descendant fully covers an identical rounded background</title>
<style>
  html, body {
    margin: 0;
    width: 800px;
    height: 600px;
    background: rgb(31, 31, 31);
  }
  .opacity-base {
    position: fixed;
    z-index: 100;
    left: 80px;
    top: 80px;
    width: 240px;
    height: 240px;
    border-radius: 30px;
    background: black;
    background-image: url("css/css-backgrounds/background-size/support/50x50-green.svg");
    background-repeat: no-repeat;
    background-position: 0 0;
    background-size: 100% 100%;
  }
  .opaque-color {
    position: absolute;
    inset: 0;
    border-radius: 30px;
    background: rgb(8, 153, 129);
  }
</style>
<div class="opacity-base"><div class="opaque-color"></div></div>
