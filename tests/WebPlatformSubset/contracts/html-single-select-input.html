<!doctype html>
<meta charset="utf-8">
<title>Collapsed single-select activation opens without changing selection</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-actions.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<style>
  body { margin: 0; }
  #choice { position: absolute; left: 20px; top: 20px; width: 240px; height: 39px; }
</style>
<select id="choice">
  <option value="one">One-way flight</option>
  <option value="return">Return flight</option>
</select>
<script>
  const observed = [];
  for (const type of ["click", "input", "change"]) {
    choice.addEventListener(type, () => observed.push(type));
  }

  promise_test(async () => {
    assert_equals(choice.value, "one", "initial value");
    await test_driver.click(choice);
    assert_equals(document.activeElement, choice, "activation focuses the select");
    assert_equals(choice.value, "one", "opening the picker does not choose another option");
    assert_equals(choice.selectedIndex, 0, "selected index remains unchanged until commit");
    assert_array_equals(observed, ["click"], "opening does not emit input/change");
  }, "native collapsed select activation opens a picker without cycling its value");
</script>
