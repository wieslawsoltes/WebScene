<!doctype html>
<meta charset="utf-8">
<title>Reference for an opaque rounded descendant covering a rounded background</title>
<style>
  html, body {
    margin: 0;
    width: 800px;
    height: 600px;
    background: rgb(31, 31, 31);
  }
  .opaque-color {
    position: fixed;
    z-index: 100;
    left: 80px;
    top: 80px;
    width: 240px;
    height: 240px;
    border-radius: 30px;
    background: rgb(8, 153, 129);
  }
</style>
<div class="opaque-color"></div>
