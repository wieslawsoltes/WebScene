<!doctype html>
<meta charset="utf-8">
<title>Canvas 2D ellipse renders selected trendline handles</title>
<style>
  html, body { margin: 0; }
  #stage { width: 320px; height: 180px; overflow: hidden; }
  canvas { display: block; width: 320px; height: 180px; }
</style>
<div id="stage"><canvas id="chart" width="320" height="180"></canvas></div>
<script>
  const context = document.querySelector("#chart").getContext("2d");
  const lineColor = "rgb(25, 118, 210)";
  const handleColor = "rgb(41, 98, 255)";

  context.fillStyle = "rgb(15, 15, 15)";
  context.fillRect(0, 0, 320, 180);

  context.strokeStyle = lineColor;
  context.lineWidth = 3;
  context.beginPath();
  context.moveTo(52, 136);
  context.lineTo(268, 32);
  context.stroke();

  context.fillStyle = "rgb(255, 0, 0)";
  context.fillRect(50, 134, 4, 4);
  context.fillRect(266, 30, 4, 4);

  function drawSelectedHandle(x, y, retainedPath) {
    context.fillStyle = "rgb(15, 15, 15)";
    context.strokeStyle = handleColor;
    context.lineWidth = 3;
    if (retainedPath) {
      const path = new Path2D();
      path.ellipse(x, y, 8, 8, 0, 0, Math.PI * 2);
      context.fill(path);
      context.stroke(path);
    } else {
      context.beginPath();
      context.ellipse(x, y, 8, 8, 0, 0, Math.PI * 2);
      context.fill();
      context.stroke();
    }
  }

  drawSelectedHandle(52, 136, false);
  drawSelectedHandle(268, 32, true);
</script>
