<!doctype html>
<meta charset="utf-8">
<title>Reference for implicit grid-row stretch and directional corners</title>
<style>
  html, body { margin: 0; background: white; }
  #stage { position: relative; width: 320px; height: 50px; padding: 6px 10px; box-sizing: border-box; background: rgb(220, 40, 40); }
  #tabs, #buttons { position: absolute; top: 6px; height: 38px; background: rgb(0, 128, 0); }
  #tabs { left: 10px; width: 222px; border-top-left-radius: 8px; }
  #buttons { left: 232px; width: 78px; border-top-right-radius: 8px; }
</style>
<div id="stage"><div id="tabs"></div><div id="buttons"></div></div>
