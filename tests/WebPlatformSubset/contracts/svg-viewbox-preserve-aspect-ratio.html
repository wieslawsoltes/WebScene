<!doctype html>
<meta charset="utf-8">
<title>SVG viewBox uses the default meet mapping unless stretching is explicit</title>
<link rel="match" href="svg-viewbox-preserve-aspect-ratio-ref.html">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: white; }
  #stage { position: relative; width: 160px; height: 100px; background: rgb(11, 24, 26); }
  svg { position: absolute; left: 10px; width: 36px; height: 18px; color: rgb(157, 171, 174); }
  #centered { top: 10px; }
  #stretched { top: 40px; }
  #trailing { top: 70px; }
</style>
<div id="stage">
  <svg id="centered" viewBox="0 0 18 18" aria-hidden="true">
    <path fill="currentColor" d="M5 2h2l8 7-8 7H5l8-7z"></path>
  </svg>
  <svg id="stretched" viewBox="0 0 18 18" preserveAspectRatio="none" aria-hidden="true">
    <path fill="currentColor" d="M5 2h2l8 7-8 7H5l8-7z"></path>
  </svg>
  <svg id="trailing" viewBox="0 0 18 18" preserveAspectRatio="xMaxYMid meet" aria-hidden="true">
    <path fill="currentColor" d="M5 2h2l8 7-8 7H5l8-7z"></path>
  </svg>
</div>
