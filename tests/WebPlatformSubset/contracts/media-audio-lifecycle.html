<!doctype html><meta charset="utf-8">
<script>
window.__webSceneWptState={complete:false,harness:null,results:[],errors:[],diagnostics:[]};
const contracts=[];
function promise_test(test,name){contracts.push({test,name});}
function assert_true(value){if(!value)throw Error('Expected true');}
function assert_false(value){assert_true(!value);}
function assert_equals(a,b){if(!Object.is(a,b))throw Error('Expected '+b+', got '+a);}
function assert_array_equals(a,b){assert_equals(JSON.stringify(a),JSON.stringify(b));}
function assert_approx_equals(a,b,t){if(Math.abs(a-b)>t)throw Error('Expected approximately '+b+', got '+a);}
function assert_throws_js(type,f){try{f();}catch(e){assert_true(e instanceof type);return;}throw Error('Expected exception');}
function assert_throws_dom(name,f){try{f();}catch(e){assert_equals(e.name,name);return;}throw Error('Expected DOMException');}
async function promise_rejects_js(t,type,promise){let failed=false;try{await promise;}catch(e){failed=true;assert_true(e instanceof type);}assert_true(failed);}
setTimeout(async()=>{for(const {test,name} of contracts){const cleanup=[];try{await Promise.race([test({add_cleanup:f=>cleanup.push(f)}),new Promise((_,reject)=>setTimeout(()=>reject(Error('Contract timeout')),5000))]);__webSceneWptState.results.push({name,status:'PASS',message:null,stack:null});}catch(e){__webSceneWptState.results.push({name,status:'FAIL',message:String(e),stack:e.stack});}finally{for(const f of cleanup)await f();}}__webSceneWptState.harness={status:__webSceneWptState.results.some(r=>r.status!=='PASS')?1:0,message:null,stack:null};__webSceneWptState.complete=true;},0);
</script>
<script>
promise_test(async t=>{
 const audio=document.createElement('audio');assert_true(audio instanceof HTMLMediaElement);assert_true(audio instanceof HTMLAudioElement);assert_true(audio instanceof HTMLElement);assert_true(audio instanceof EventTarget);
 assert_equals(audio.readyState,0);assert_true(audio.paused);assert_true(Number.isNaN(audio.duration));
 const events=[];for(const name of ['loadstart','loadedmetadata','loadeddata','canplay'])audio.addEventListener(name,()=>events.push(name));
 const ready=new Promise((resolve,reject)=>{audio.addEventListener('canplay',resolve,{once:true});audio.addEventListener('error',()=>reject(Error(audio.error.message)),{once:true});});
 audio.src='resources/media/stereo.wav';await ready;
 assert_array_equals(events,['loadstart','loadedmetadata','loadeddata','canplay']);assert_equals(audio.duration,.1);assert_equals(audio.readyState,4);
 const seeked=new Promise(resolve=>audio.addEventListener('seeked',resolve,{once:true}));audio.currentTime=.05;assert_true(audio.seeking);await seeked;assert_false(audio.seeking);assert_approx_equals(audio.currentTime,.05,.00001);
 audio.removeAttribute('src');audio.load();assert_equals(audio.readyState,0);assert_true(audio.paused);
},'Native media decode drives metadata/readiness and seek lifecycle');
promise_test(async t=>{
 const context=new AudioContext({sampleRate:48000});t.add_cleanup(()=>context.state==='closed'?undefined:context.close());
 const response=await fetch('resources/media/stereo.wav');const input=await response.arrayBuffer();const promise=context.decodeAudioData(input);assert_equals(input.byteLength,0);const result=await promise;
 assert_true(result instanceof AudioBuffer);assert_equals(result.sampleRate,48000);assert_equals(result.numberOfChannels,2);assert_approx_equals(result.duration,.1,.002);
 assert_approx_equals(result.getChannelData(0)[100],.25,.002);assert_approx_equals(result.getChannelData(1)[100],-.25,.002);
 const gain=context.createGain(),meter=context.createAnalyser();assert_equals(gain.connect(meter),meter);meter.connect(context.destination);gain.gain.value=.5;gain.gain.setTargetAtTime(0,context.currentTime,.01);meter.fftSize=1024;assert_equals(meter.frequencyBinCount,512);const data=new Float32Array(1024);meter.getFloatTimeDomainData(data);assert_true(data.every(x=>x===0));gain.disconnect();await context.close();assert_equals(context.state,'closed');
},'Native AudioContext decodes and resamples real PCM and exposes a native graph');
promise_test(async t=>{
 const context=new AudioContext();t.add_cleanup(()=>context.close());
 let error;try{await context.decodeAudioData(new Uint8Array([1,2,3]).buffer);}catch(e){error=e;}assert_equals(error.name,'EncodingError');
 const meter=context.createAnalyser();assert_throws_dom('IndexSizeError',()=>meter.fftSize=33);
 const a=context.createGain(),b=context.createGain();a.connect(b);assert_throws_js(TypeError,()=>b.connect(a));
},'Invalid encoded audio, analyser configuration and unsupported graph cycles fail');
promise_test(async t=>{
 const bytes=new Uint8Array([0,255,128,65,10]);const blob=new Blob([bytes],{type:'application/octet-stream'});const url=URL.createObjectURL(blob);
 const response=await fetch(url),copy=response.clone();assert_array_equals(Array.from(new Uint8Array(await response.arrayBuffer())),Array.from(bytes));assert_true(response.bodyUsed);assert_array_equals(Array.from(new Uint8Array(await (await copy.blob()).arrayBuffer())),Array.from(bytes));
 URL.revokeObjectURL(url);await promise_rejects_js(t,TypeError,fetch(url));assert_array_equals(Array.from(new Uint8Array(await blob.slice(1,3).arrayBuffer())),[255,128]);
},'Fetch and Blob preserve binary bytes, consumption, cloning and revocation');
</script>

<script>
promise_test(async t=>{
 const c=new AudioContext();const destination=c.createMediaStreamDestination();const stream=destination.stream,track=stream.getAudioTracks()[0],clone=track.clone();
 assert_true(stream instanceof MediaStream);assert_true(track instanceof MediaStreamTrack);assert_equals(track.kind,'audio');assert_true(track.id!==clone.id);assert_equals(track.readyState,'live');track.stop();assert_equals(track.readyState,'ended');assert_equals(clone.readyState,'live');assert_false(stream.active);const copy=new MediaStream([clone]);assert_true(copy.active);await c.close();assert_equals(clone.readyState,'ended');assert_false(copy.active);
},'Native mixed audio tracks clone and stop independently and end on context close');
promise_test(async t=>{
 const audio=new Audio('resources/media/stereo.wav');t.add_cleanup(()=>audio.removeAttribute('src'));const playing=audio.play();audio.pause();let error;try{await playing;}catch(e){error=e;}assert_equals(error.name,'AbortError');assert_true(audio.paused);assert_equals(audio.played.length,0);
 const controller=new AbortController();controller.abort();let aborted;try{await fetch('resources/media/stereo.wav',{signal:controller.signal});}catch(e){aborted=e;}assert_equals(aborted.name,'AbortError');
},'Pause before play resolves rejects and aborted resource requests settle');
</script>

<script>
promise_test(async t=>{
 const container=document.createElement('div');container.innerHTML='<audio preload="metadata"><source src="resources/media/stereo.wav" type="audio/wav"></audio>';document.body.appendChild(container);t.add_cleanup(()=>container.remove());
 await new Promise(resolve=>setTimeout(resolve,300));const audio=container.querySelector('audio');if(audio.readyState!==4)throw Error(JSON.stringify({ready:audio.readyState,network:audio.networkState,error:audio.error?.message,url:audio.currentSrc,html:audio.innerHTML,connected:audio.isConnected,source:audio.querySelector('source')?.getAttribute('src'),type:audio.querySelector('source')?.getAttribute('type')}));assert_equals(audio.readyState,4);assert_equals(audio.duration,.1);assert_equals(audio.played.length,0);
 container.remove();await new Promise(resolve=>setTimeout(resolve,20));assert_equals(audio.readyState,0);assert_true(audio.paused);
},'Markup source selection loads without querying the media wrapper and removal cancels it');
</script>

<script>
promise_test(async t=>{
 const audio=new Audio(),c=new AudioContext();c.createMediaElementSource(audio);assert_throws_dom('InvalidStateError',()=>c.createMediaElementSource(audio));await c.close();const another=new AudioContext();t.add_cleanup(()=>another.close());assert_throws_dom('InvalidStateError',()=>another.createMediaElementSource(audio));
 const buffer=another.createBuffer(1,128,48000);const rate=buffer.sampleRate;try{buffer.sampleRate=1;}catch{}assert_equals(buffer.sampleRate,rate);assert_equals(buffer.getChannelData(0).length,128);
},'Media source ownership persists after context close and decoded buffer metadata is readonly');
</script>

<script>
promise_test(async()=>{
 const getter=Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype,'readyState').get;assert_throws_js(TypeError,()=>getter.call({tagName:'AUDIO',hasAttribute:()=>false}));
 const original=HTMLVideoElement;try{globalThis.HTMLVideoElement=function Replacement(){};const video=document.createElement('video');assert_true(video instanceof original);assert_equals(Object.prototype.toString.call(video),'[object HTMLVideoElement]');}finally{globalThis.HTMLVideoElement=original;}
},'Media receivers require native DOM branding and constructor reassignment preserves intrinsic prototypes');
</script>
