<!doctype html><meta charset="utf-8">
<title>Sticky table header and date column survive scrolling</title>
<link rel="help" href="https://drafts.csswg.org/css-position/#stickypos-insets">
<script src="/resources/testharness.js"></script><script src="/resources/testharnessreport.js"></script>
<style>
body{margin:0}#scroller{width:220px;height:100px;overflow:auto;position:relative}
table{width:400px;border-spacing:0;table-layout:fixed}thead{position:sticky;top:0;z-index:8}
th,td{padding:0;height:40px;background:white}th:first-child,td:first-child{position:sticky;left:0}
#date{z-index:9}#bodyrow{height:400px}
</style>
<div id="scroller"><table><thead id="header"><tr><th id="date" rowspan="2"><span id="label" style="display:block;height:20px">Date · 1h</span></th><th>Price</th></tr><tr><th>Open</th></tr></thead><tbody><tr id="bodyrow"><td id="rowdate">Row</td><td>1</td></tr></tbody></table></div>
<script>
test(()=>{assert_equals(getComputedStyle(header).position,'sticky');assert_equals(getComputedStyle(date).position,'sticky');},'Sticky positioning is preserved in computed style');
test(()=>{const a=date.getBoundingClientRect(),b=label.getBoundingClientRect();assert_approx_equals(b.top+b.height/2,a.top+a.height/2,0.1);},'A rowspan header centers its content across both rows');
test(()=>{const before=header.getBoundingClientRect().top;scroller.scrollTop=120;scroller.scrollLeft=100;assert_equals(header.getBoundingClientRect().top,before);assert_equals(date.getBoundingClientRect().left,0);assert_equals(rowdate.getBoundingClientRect().left,0);assert_true(date.contains(document.elementFromPoint(20,20)));},'Header and first column remain visible and hit-testable after both-axis scrolling');
test(()=>{scroller.scrollTop=0;scroller.scrollLeft=0;assert_equals(header.getBoundingClientRect().top,0);assert_equals(date.getBoundingClientRect().left,0);},'Scrolling back does not accumulate sticky offsets');
</script>
