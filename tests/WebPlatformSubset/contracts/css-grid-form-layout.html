<!doctype html>
<meta charset="utf-8">
<title>Fractional and automatic grid tracks arrange ordinary form rows</title>
<style>
  body { margin: 0; font: 16px/20px Arial, sans-serif; }
  .temperature {
    display: grid;
    width: 500px;
    grid-template-columns: 1fr auto 1fr;
    column-gap: 12px;
  }
  .temperature > * { height: 39px; }
  .equals { width: 12px; }
  .crud {
    display: grid;
    width: 500px;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    column-gap: 18px;
  }
  .crud > * { height: 80px; }
  .placed {
    display: grid;
    width: 200px;
    grid-template-columns: 60px 140px;
    grid-template-rows: 20px 20px;
  }
  #placed-a { grid-row: 1 / 3; }
  #placed-c { grid-column: 2; }
</style>
<div class="temperature" id="temperature">
  <label id="celsius"></label><span class="equals" id="equals">=</span><label id="fahrenheit"></label>
</div>
<div class="crud" id="crud"><div id="list"></div><div id="form"></div></div>
<div class="placed"><div id="placed-a"></div><div id="placed-b"></div><div id="placed-c"></div></div>
<script>
  const state = window.__webSceneWptState = {
    complete: false, harness: null, results: [], errors: [], diagnostics: []
  };
  const rect = id => document.getElementById(id).getBoundingClientRect();
  const close = (actual, expected) => Math.abs(actual - expected) <= .01;
  const require = (value, message) => { if (!value) throw new Error(message); };
  const check = (name, assertion) => {
    const result = { name };
    try { assertion(); result.status = "PASS"; result.message = null; result.stack = null; }
    catch (error) { result.status = "FAIL"; result.message = String(error.message || error); result.stack = error.stack || null; }
    state.results.push(result);
  };

  check("one automatic middle track leaves equal fractional form tracks", () => {
    const left = rect("celsius"), middle = rect("equals"), right = rect("fahrenheit");
    require(close(left.width, 232) && close(middle.width, 12) && close(right.width, 232),
      JSON.stringify({ left, middle, right }));
    require(close(middle.left - left.right, 12) && close(right.left - middle.right, 12),
      "grid gaps or source-order placement changed");
  });

  check("minmax fractional CRUD columns share the available width", () => {
    const list = rect("list"), form = rect("form");
    require(close(list.width, 241) && close(form.width, 241), JSON.stringify({ list, form }));
    require(close(form.left - list.right, 18), "CRUD gap=" + (form.left - list.right));
  });

  check("explicit row spans and column placement retain the authored cells", () => {
    const a = rect("placed-a"), b = rect("placed-b"), c = rect("placed-c");
    require(close(a.width, 60) && close(a.height, 40), JSON.stringify(a));
    require(close(b.left, 60) && close(b.top, 119), JSON.stringify(b));
    require(close(c.left, 60) && close(c.top, 139), JSON.stringify(c));
  });

  state.diagnostics = [JSON.stringify({
    celsius: rect("celsius"), equals: rect("equals"), fahrenheit: rect("fahrenheit"),
    list: rect("list"), form: rect("form"),
    placedA: rect("placed-a"), placedB: rect("placed-b"), placedC: rect("placed-c")
  })];
  state.harness = { status: state.results.some(result => result.status !== "PASS") ? 1 : 0, message: null, stack: null };
  state.complete = true;
</script>
