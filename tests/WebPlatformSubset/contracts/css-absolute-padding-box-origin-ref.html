<!doctype html>
<meta charset="utf-8">
<title>Reference for an inset-stretched absolute child with negative margins</title>
<style>
  html, body { margin: 0; width: 800px; height: 600px; background: #1f1f1f; }
  .shell { display: inline-block; margin: 80px; }
  button { all: unset; display: inline-block; position: relative; }
  .control {
    position: relative;
    display: inline-flex;
    box-sizing: border-box;
    width: 34px;
    height: 34px;
    border: 1px solid #2962ff;
    border-radius: 6px;
  }
  .shadow {
    position: fixed;
    left: 80px;
    top: 80px;
    box-sizing: content-box;
    width: 30px;
    height: 30px;
    border: 2px solid #2962ff;
    border-radius: 6px;
  }
  .color {
    position: fixed;
    left: 85px;
    top: 85px;
    width: 24px;
    height: 24px;
    border-radius: 3px;
    background: #089981;
  }
</style>
<span class="shell"><button><span><div class="control">
  <span class="shadow"></span><span class="color"></span>
</div></span></button></span>
