<!doctype html>
<meta charset="utf-8">
<title>Unsupported legacy editing commands report failure</title>
<link rel="help" href="https://w3c.github.io/editing/docs/execCommand/">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<div id="editor" contenteditable>unchanged</div>
<script>
test(() => {
  assert_equals(typeof Document.prototype.execCommand, 'function');
  assert_false(document.execCommand('webscene-unknown-command'));
  assert_equals(document.getElementById('editor').textContent, 'unchanged');
}, 'Unsupported commands return false without mutating the document');

test(() => {
  assert_throws_js(TypeError, () => document.execCommand());
  assert_throws_js(TypeError, () => document.execCommand(Symbol('command')));
  const sentinel = new Error('conversion');
  assert_throws_exactly(sentinel, () => document.execCommand({toString() { throw sentinel; }}));
  const converted = [];
  assert_false(document.execCommand({toString() { converted.push('command'); return 'unknown'; }}, false,
    {toString() { converted.push('value'); return ''; }}));
  assert_array_equals(converted, ['command', 'value']);
}, 'execCommand validates its required argument and performs DOMString conversion');

test(() => {
  assert_throws_js(TypeError, () => Document.prototype.execCommand.call({}, 'unknown'));
  assert_throws_js(TypeError, () => new document.execCommand('unknown'));
  assert_false(document.implementation.createHTMLDocument('').execCommand('unknown'));
}, 'execCommand is a non-constructible Document operation, including detached documents');

test(() => {
  assert_throws_dom('InvalidStateError', () => new Document().execCommand('unknown'));
  assert_throws_dom('InvalidStateError', () =>
    document.implementation.createDocument('urn:test', 'root').execCommand('unknown'));
}, 'Legacy editing commands reject non-HTML documents');
</script>
