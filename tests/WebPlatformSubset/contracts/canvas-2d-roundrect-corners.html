<!doctype html>
<meta charset="utf-8">
<title>Canvas 2D roundRect preserves rounded corners</title>
<style>
  html, body { margin: 0; }
  canvas { display: block; width: 100px; height: 50px; }
</style>
<canvas width="100" height="50"></canvas>
<script>
  const context = document.querySelector("canvas").getContext("2d");
  context.fillStyle = "rgb(255, 0, 0)";
  context.fillRect(0, 0, 100, 50);
  context.fillStyle = "rgb(0, 0, 255)";
  context.fillRect(30, 15, 40, 20);
  context.beginPath();
  context.roundRect(0, 0, 100, 50, [{ x: 20, y: 14 }, 8, 16, 4]);
  context.fillStyle = "rgb(0, 255, 0)";
  context.fill();
</script>
