<!doctype html>
<meta charset="utf-8">
<title>WebScene contract: Canvas 2D chart drawing primitives</title>
<canvas id="chart" width="160" height="100"></canvas>
<script>
const state = window.__webSceneWptState = {
  complete: false,
  harness: null,
  results: [],
  errors: [],
  diagnostics: []
};
function assert(condition, message) {
  if (!condition) throw new Error(message);
}
try {
  const canvas = document.getElementById("chart");
  const context = canvas.getContext("2d");
  assert(!!context, "2D context is available");

  context.save();
  context.setTransform(1, 0, 0, 1, 0, 0);
  context.clearRect(0, 0, canvas.width, canvas.height);
  context.translate(4, 6);
  context.scale(1.25, 0.75);
  context.setLineDash([4, 2]);
  context.beginPath();
  context.moveTo(2, 4);
  context.lineTo(30, 4);
  context.arcTo(40, 4, 40, 14, 5);
  context.arc(40, 20, 6, 0, Math.PI);
  context.rect(8, 28, 24, 12);
  context.closePath();
  context.save();
  context.clip();
  context.fillRect(0, 0, 80, 60);
  context.restore();
  context.fill();
  context.stroke();
  context.fillText("chart", 48, 30);
  context.fillText("condensed", 48, 46, 12);
  context.font = "10px sans-serif";
  const small = context.measureText("Canvas 123");
  context.font = "20px sans-serif";
  const large = context.measureText("Canvas 123");
  context.font = "700 20px -apple-system, BlinkMacSystemFont, Arial, sans-serif";
  const weighted = context.measureText("Canvas 123");
  const mixedNumeric = context.measureText("Ex Date: Mon Aug 10 2026");
  context.font = "20px monospace";
  const monospaced = context.measureText("iiiiWWWW");
  context.font = "20px serif";
  const serif = context.measureText("iiiiWWWW");
  assert(Number.isFinite(small.width) && small.width > 0,
    "measureText returns a finite positive width");
  assert(large.width > small.width * 1.8 && large.width < small.width * 2.2,
    "measureText follows the active font size: " + small.width + "/" + large.width);
  assert(Number.isFinite(weighted.actualBoundingBoxAscent)
      && Number.isFinite(weighted.actualBoundingBoxDescent)
      && weighted.actualBoundingBoxAscent > 0,
    "TextMetrics exposes finite host ascent and descent: "
      + weighted.actualBoundingBoxAscent + "/" + weighted.actualBoundingBoxDescent);
  assert(Number.isFinite(mixedNumeric.actualBoundingBoxLeft)
      && Number.isFinite(mixedNumeric.actualBoundingBoxRight)
      && mixedNumeric.actualBoundingBoxRight > mixedNumeric.width * .9,
    "mixed alpha-numeric TextMetrics retain browser-like ink and advance bounds");
  assert(Math.abs(monospaced.width - serif.width) > .1,
    "measureText resolves the active font family: " + monospaced.width + "/" + serif.width);
  const label = document.createElement("span");
  label.textContent = "Canvas label";
  label.style.cssText = "position:absolute;left:0;top:110px;display:inline-block;white-space:pre";
  label.style.fontWeight = "700";
  label.style.fontSize = "20px";
  label.style.fontFamily = "-apple-system,BlinkMacSystemFont,Arial,sans-serif";
  document.body.appendChild(label);
  context.font = "700 20px -apple-system, BlinkMacSystemFont, Arial, sans-serif";
  const canvasLabelWidth = context.measureText(label.textContent).width;
  const domLabelWidth = label.getBoundingClientRect().width;
  assert(Math.abs(canvasLabelWidth - domLabelWidth) <= 2,
    "DOM and Canvas consume the same host font advance: " + domLabelWidth + "/" + canvasLabelWidth);
  context.restore();

  const base = new Path2D();
  base.arc(70, 40, 8, 0, Math.PI * 2);
  const combined = new Path2D();
  const identity = new DOMMatrixReadOnly();
  const markerTransform = identity.translate(3, 4)
    .scale(.5, .25)
    .translate(6, 8);
  assert(identity.a === 1 && identity.d === 1 && identity.e === 0 && identity.f === 0,
    "DOMMatrixReadOnly transform methods do not mutate their source");
  assert(markerTransform.a === .5 && markerTransform.d === .25
      && markerTransform.e === 6 && markerTransform.f === 6,
    "DOMMatrix transform chaining preserves scale and translation: "
      + [markerTransform.a, markerTransform.d,
        markerTransform.e, markerTransform.f].join(","));
  context.setTransform(markerTransform);
  context.fill(base);
  context.resetTransform();
  combined.addPath(base, markerTransform);
  context.fill(combined);
  state.results.push({
    name: "chart-shaped Canvas 2D and Path2D primitives execute as one stateful composition",
    status: "PASS",
    message: null,
    stack: null
  });
  state.harness = { status: 0, message: null, stack: null };
} catch (error) {
  state.results.push({
    name: "chart-shaped Canvas 2D and Path2D primitives execute as one stateful composition",
    status: "FAIL",
    message: String(error && error.message || error),
    stack: error && error.stack ? String(error.stack) : null
  });
  state.harness = {
    status: 1,
    message: state.results[0].message,
    stack: state.results[0].stack
  };
}
state.complete = true;
</script>
